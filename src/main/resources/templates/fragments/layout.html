<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' · Thindesk'">Thindesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../static/css/style.css">
</head>
<body>

<aside th:fragment="sidebar" class="sidebar" id="sidebar">
    <a class="sidebar-brand" th:href="@{/}" href="#">
        <img th:src="@{/images/logo.png}" src="../static/images/logo.png" alt="" width="32" height="32">
        <span>Thindesk</span>
    </a>
    <nav class="nav flex-column">
        <a class="nav-link" th:if="${ehGestor}" th:classappend="${pagina == 'dashboard'} ? 'active'" th:href="@{/dashboard}" href="#">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <a class="nav-link" th:classappend="${pagina == 'chamados'} ? 'active'" th:href="@{/chamados}" href="#">
            <i class="bi bi-headset"></i> Chamados
        </a>
        <a class="nav-link" th:classappend="${pagina == 'clientes'} ? 'active'" th:href="@{/clientes}" href="#">
            <i class="bi bi-people"></i> Clientes
        </a>
    </nav>
    <div class="sidebar-footer">
        <div class="small text-white-50">Conectado como</div>
        <div class="fw-semibold text-white mb-2" th:text="${usuarioLogado}">admin</div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-sm btn-outline-light w-100"><i class="bi bi-box-arrow-right"></i> Sair</button>
        </form>
    </div>
</aside>

</body>
</html>
