spring.application.name=thindesk

# ---------------------------------------------------------------
# Banco de dados (MongoDB)
# A connection string NAO fica no codigo: ela vem da variavel de
# ambiente MONGODB_URI. Sem a variavel, usa um MongoDB local.
# (Spring Boot 4: a propriedade e "spring.mongodb.uri")
# ---------------------------------------------------------------
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/thindesk}
spring.data.mongodb.auto-index-creation=true
spring.mongodb.auto-index-creation=true

# ---------------------------------------------------------------
# Carga inicial de dados (base grande para o dashboard)
# Roda apenas quando a colecao "chamados" esta vazia.
# Para recriar tudo: THINDESK_SEED_RESET=true (apaga e recria)
# ---------------------------------------------------------------
thindesk.seed.enabled=${THINDESK_SEED_ENABLED:true}
thindesk.seed.reset=${THINDESK_SEED_RESET:false}
thindesk.seed.clientes=${THINDESK_SEED_CLIENTES:1500}
thindesk.seed.tecnicos=${THINDESK_SEED_TECNICOS:40}
thindesk.seed.chamados=${THINDESK_SEED_CHAMADOS:30000}
thindesk.seed.meses=${THINDESK_SEED_MESES:18}

# Fuso usado para agrupar chamados por dia/semana/mes
thindesk.fuso-horario=America/Sao_Paulo

# ---------------------------------------------------------------
# Web / Thymeleaf
# ---------------------------------------------------------------
spring.thymeleaf.cache=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.error.include-message=never
server.error.include-stacktrace=never

logging.level.com.pfc.thindesk=INFO
